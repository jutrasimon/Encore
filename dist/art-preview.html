<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENCORE — atelier des illustrations</title>
<style>body{background:#10190f;color:#fff4d2;font:16px system-ui;margin:20px}main{display:flex;flex-wrap:wrap;gap:24px}article{width:var(--width,460px);max-width:100%}img{width:100%;display:block}canvas{width:100%;display:block;aspect-ratio:3/1}label{display:inline-block;margin:0 15px 20px 0}select,button{font:inherit;padding:8px}h2{font-size:20px}.show-visual{pointer-events:none;border:1px solid #536343}p{max-width:70ch}</style>
<h1>Atelier des illustrations</h1><p>Composant visuel du jeu, sans sauvegarde ni commandes de partie. Les trois lieux utilisent les mêmes états et la même horloge.</p>
<label>Largeur <select id="width"><option>460</option><option>390</option><option>320</option></select></label>
<label>Pose <select id="pose"><option value="">Rythme</option><option value="voice">Chant</option><option value="guitar">Riff</option><option value="happy">Content</option><option value="neutral">Neutre</option><option value="sad">Triste</option></select></label>
<label><input id="drive" type="checkbox">Overdrive</label><label><input id="reduced" type="checkbox">Mouvement réduit</label><label><input id="paused" type="checkbox">Pause</label><main></main>
<h2>Découpes de la dernière chanson — fonds clair et sombre</h2><div id="finale-samples"></div>
<style>#finale-samples{display:flex;flex-wrap:wrap;gap:12px}.sprite-samples{padding:12px;width:310px;display:flex;flex-wrap:wrap;gap:3px;background:#dfdbc3}.sprite-samples.dark{background:#10190f}.sprite-samples img{width:100%}.sprite-samples i{width:100px;height:100px;background-size:300% 200%}</style>
<script type="module">
import {ShowVisual,showVisualMarkup,showAsset} from './show-art.js?v=0.9.15';
for(const tone of ['light','dark']){const block=document.createElement('section');block.className='sprite-samples '+tone;block.innerHTML='<img src="art/finale/song-banner.png" alt="Bandeau rose">';for(const sheet of ['splats','splats-alt','comics'])for(let cell=0;cell<6;cell++){const sprite=document.createElement('i');sprite.style.backgroundImage=`url(art/finale/${sheet}.png)`;sprite.style.backgroundPosition=`${cell%3*50}% ${Math.floor(cell/3)*100}%`;sprite.title=sheet+' '+cell;block.append(sprite);}document.querySelector('#finale-samples').append(block);}
const names=['Le sous-sol','Le petit pub','Le toit pirate'],visuals=names.map((name,i)=>{const el=document.createElement('article');el.innerHTML=`<h2>${name}</h2><img src="${showAsset(i,'cover')}" alt="${name}">${showVisualMarkup()}`;document.querySelector('main').append(el);return new ShowVisual();});
function draw(now){const pose=document.querySelector('#pose').value;document.documentElement.style.setProperty('--width',document.querySelector('#width').value+'px');visuals.forEach((v,i)=>v.update(document.querySelectorAll('canvas')[i],{show:i,role:'guitarist-singer',performance:pose,result:['happy','neutral','sad'].includes(pose)?pose:null,overdrive:document.querySelector('#drive').checked,reduced:document.querySelector('#reduced').checked,paused:document.querySelector('#paused').checked,intensity:.8,hit:String(Math.floor(now/1000))},now));requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
