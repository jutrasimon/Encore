name: Keep Supabase awake
# Supabase Free pauses a project after a week without activity. A read of a
# non-existent band reaches the database (404, nothing written) on both functions.
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read an unknown band on each function
        run: |
          token=$(openssl rand -hex 32)
          for fn in encore encore-preview; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST \
              "https://imghkkvpotbxqvwnbjxg.supabase.co/functions/v1/$fn/room" \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              -d '{"code":"000000000000","type":"sync"}')
            echo "$fn: HTTP $status"
            # 404 = the function answered after querying the database.
            test "$status" = 404
          done
